<!doctype html><html lang="en"><head>
<base href="/">
<script src="/api/profile/bootstrap"></script><script src="/shared/profiles.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Play with Family · Family Arcade</title>
<link rel="stylesheet" href="/multiplayer/styles.css"></head><body>
<main id="lobby"><h1>🎮 Play with Family</h1><p>Choose a game, then a door!</p><div class="games" id="games"><button data-game="chess" autofocus>♟ Chess Quest</button><button data-game="kitchen">🧑‍🍳 Kitchen Pals</button></div><section id="doors" hidden><h2 id="doorTitle"></h2><p id="doorHint" role="status">Looking for family…</p><div id="doorList" class="games"></div><button id="createDoor">🚪 ＋ Open a new door</button><p><button id="backGames">← Choose another game</button></p></section><p id="error" role="alert"></p><p><a class="button" href="/index.html">Back to arcade</a></p><p class="small">D-pad to choose · A to go · B to go back</p></main>
<section id="session"><header><span id="status">Connecting…</span><span><button id="leave">Leave room</button></span></header><iframe id="game" title="Family game" allow="autoplay; gamepad"></iframe><div id="waiting"><div class="card"><h2 id="waitTitle">Waiting for family</h2><p id="waitText">Your family can choose this game and join your door.</p><div id="waitingDoor" class="doorPicture" aria-label="Door number"></div><p>🎮 → 🚪 → 👫</p><button id="leaveWait">Back to arcade</button></div></div><div id="touch"><div><button data-key="left">◀</button><button data-key="up">▲</button><button data-key="down">▼</button><button data-key="right">▶</button></div><div><button data-key="B">Pause</button><button data-key="X">X</button><button data-key="A">A</button></div></div></section>
<script src="/shared/gamepad-std.js"></script><script src="/multiplayer/lobby.js"></script></body></html>
