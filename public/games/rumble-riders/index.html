<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rumble Riders · Star Sprint</title><link rel="icon" href="data:,"><link rel="stylesheet" href="styles.css?v=8"></head>
<body><main><canvas id="road" aria-label="Coastal bike race: steer, collect stars and jump"></canvas>
<header><div class="brand">RUMBLE<span>RIDERS</span></div><div class="race-hud"><div class="stars" aria-label="Stars collected">★ <strong id="stars">0</strong><small id="place" aria-label="Race position">7 / 7</small></div><div class="progress" aria-label="Distance to finish"><span id="progress"></span><b>🏁</b><i id="rider-progress">🏍</i></div></div><div class="menu-buttons"><button id="sound" aria-label="Mute sound">♫</button><button id="pause" aria-label="Pause race">Ⅱ</button></div></header>
<div id="message" role="status"></div><div id="challenge-hud" aria-label="Circuit challenge"><span id="circuit-label"></span><span id="challenge-icon"></span><span id="challenge-dots"></span><div id="draft-meter"><i></i></div></div>
<footer><div class="speed"><div id="turbo" aria-label="Collect three stars for turbo">☆☆☆</div><strong id="speed">0</strong><span>KM/H</span><span id="slope" aria-label="Road slope"></span></div><p>← → &nbsp; / &nbsp; A D &nbsp; STEER <b>·</b> SPACE JUMP <b>·</b> P PAUSE</p></footer>
<div class="touch"><button data-key="ArrowLeft" aria-label="Steer left">◀</button><button data-key="ArrowRight" aria-label="Steer right">▶</button><button data-key="Space" aria-label="Jump">⤴</button></div>
<section id="intro" class="overlay" aria-label="How to play"><div class="panel"><div id="circuit-picker" class="circuit-picker" aria-label="Choose circuit"></div><div id="challenge-demo" class="challenge-demo"></div><div class="picture-goal">🏍 <span>★ ★ ★</span> 🏁</div><div class="turbo-lesson">★ ★ ★ → ⚡</div><div class="lessons"><div><div class="demo steer">🏍</div><div class="key-icons">◀ &nbsp; ▶</div></div><div><div class="demo hop">🏍</div><div class="little-puddle"></div><div class="key-icons">⤴ <kbd>SPACE</kbd> / Ⓐ</div></div></div><button id="play" class="primary" aria-label="Start race">▶</button><a class="home" href="/" aria-label="Back to arcade">⌂</a></div></section>
<section id="finish" class="overlay" hidden aria-label="Race complete"><div class="panel"><div id="tour-stamps" class="tour-stamps"></div><div class="trophy">🏆</div><div id="clear-badge" class="clear-badge"></div><div id="finish-place" class="finish-place"></div><div id="result-stars" class="result-stars"></div><div class="jar" aria-label="Collected stars toward bike colours"><span>★</span><strong id="bank">0</strong><div class="jar-track"><i id="jar-fill"></i></div></div><div id="colours" class="colours" aria-label="Choose a bike colour"></div><div class="finish-actions"><button id="again" aria-label="Replay this circuit">↻</button><button id="next" class="primary" aria-label="Next circuit">▶</button><button id="tour-map" aria-label="Choose a circuit">▦</button></div><a class="home" href="/" aria-label="Back to arcade">⌂</a></div></section>
</main><script src="environments.js?v=8"></script><script src="scenery.js?v=8"></script><script src="world-art.js?v=8"></script><script src="circuits.js?v=8"></script><script src="riding.js?v=8"></script><script src="game.js?v=8"></script></body></html>
