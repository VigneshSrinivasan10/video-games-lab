  if(m.cook>0)for(let k=0;k<3;k++)ellipse(ctx,x-14+k*14,y-5-((S.t*16+k*9)%28),5,9,'#fff7d580');
 }
 if(S.mode==='play')S.players.forEach((p,i)=>{if(i&&!S.team)return;const st=nearStation(p);if(!st)return;ctx.strokeStyle=i?'#ff9bbd':'#58e5e1';ctx.lineWidth=5;ctx.beginPath();ctx.roundRect(OX+st.c*T,OY+st.r*T-2,T,T-5,12);ctx.stroke();});
 if(S.mode==='play')drawGuide();
 [...S.players].sort((a,b)=>a.y-b.y).forEach(p=>drawChef(p,p.id));
 for(const p of S.particles){ctx.globalAlpha=Math.min(1,p.t*2);ctx.fillStyle=p.color;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.t*3);ctx.fillRect(-4,-4,8,8);ctx.restore();}ctx.globalAlpha=1;
}
function resize(){const box=$('stage').getBoundingClientRect();const sc=Math.max(.05,Math.min((box.width-10)/W,(box.height-12)/H));canvas.style.width=W*sc+'px';canvas.style.height=H*sc+'px';const d=Math.min(devicePixelRatio||1,1.5);if(canvas.width!==Math.round(W*d)){canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);}}
new ResizeObserver(resize).observe($('stage'));window.addEventListener('resize',resize);
let perfSum=0,perfFrames=0;
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;const begin=performance.now();
 if(FAMILY?.role!=='guest'){
  const inputs=poll();if(!FAMILY||FAMILY.ready){acc=Math.min(.05,acc+dt);let n=0;while(acc>=1/120&&n++<6){tick(1/120,inputs);for(const p of inputs)p.A=false;actions=[false,false];acc-=1/120;}}else{actions=[false,false];acc=0;}
 }else{for(const p of S.players){p.x+=(p.c-p.x)*Math.min(1,dt*18);p.y+=(p.r-p.y)*Math.min(1,dt*18);}}
 renderUI();updateHUD();render();music(now/1000);perfSum+=performance.now()-begin;if(++perfFrames===300){window.KP.frameMs=perfSum/perfFrames;perfSum=perfFrames=0;}
}
unlockedInfo();renderUI();resize();
window.KP={requestAction,tapCounter,nextStep,guidePath,S,LEVELS,RECIPES,GRID,stationList,starCells,startLevel,move,act,tick,command,show,saveRun,get DB(){return DB;},get SAVE(){return SAVE;},frameMs:0};
if(FAMILY){
 FAMILY.register({
  start(){S.team=true;show('title');},pointer:tapCounter,unlock:audioUnlock,input(){},action:familyAction,
  connection(ready){localKeys={};touch={};actions=[false,false];remoteActions=[];acc=0;if(!ready)FAMILY.remote={};},
  snapshot(){S.focus=document.activeElement?.id||S.focus;return {state:S,menu:S.mode!=='play',sounds:sounds.splice(0),reward:{level:S.level,stars:SAVE.stars[S.level],unlocked:SAVE.unlocked,won:SAVE.won}};},
  apply(v){if(!v?.state)return;const oldLevel=S.level,oldMode=S.mode,old=S.players.map(p=>({x:p.x,y:p.y}));for(const key of Object.keys(S))if(key in v.state)S[key]=v.state[key];
   if(oldLevel===S.level&&oldMode===S.mode)S.players.forEach((p,i)=>{if(old[i]&&Math.hypot(p.c-old[i].x,p.r-old[i].y)<3){p.x=old[i].x;p.y=old[i].y;}});
   if(v.reward){const r=v.reward,before=JSON.stringify(SAVE);if(r.level>=0&&r.level<8){SAVE.stars[r.level]|=r.stars;SAVE.unlocked=Math.max(SAVE.unlocked,clamp(r.unlocked,1,8));SAVE.won||=r.won;}if(before!==JSON.stringify(SAVE))writeDB();}
   renderUI();if(S.focus&&$(S.focus)&&document.activeElement?.id!==S.focus)$(S.focus).focus();for(const kind of v.sounds||[])sound(kind,false);
  }
 });
}
requestAnimationFrame(frame);
})();
